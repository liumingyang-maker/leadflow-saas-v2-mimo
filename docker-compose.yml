services:
  web:
    build: .
    environment:
      - APP_ENV=development
      - SECRET_KEY=dev-only-change-me
      - DATABASE_URL=sqlite:////data/leadflow-v2.db
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "5000:5000"
    volumes:
      - leadflow_data:/data
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health/live', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7.4.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  db:
    image: alpine:3.21.3
    command: ["sh", "-c", "mkdir -p /data && touch /data/leadflow-v2.db && tail -f /dev/null"]
    volumes:
      - leadflow_data:/data
    healthcheck:
      test: ["CMD", "test", "-f", "/data/leadflow-v2.db"]
      interval: 10s
      timeout: 3s
      retries: 3

  worker:
    build: .
    environment:
      - APP_ENV=development
      - SECRET_KEY=dev-only-change-me
      - DATABASE_URL=sqlite:////data/leadflow-v2.db
      - REDIS_URL=redis://redis:6379/0
      - BROWSER_REDIS_URL=redis://browser-redis:6379/0
      - BROWSER_ARTIFACT_DIR=/browser-artifacts
    volumes:
      - leadflow_data:/data
      - leadflow_browser_artifacts:/browser-artifacts
    networks:
      - default
      - browser-control
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    command: python run_worker.py default
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  browser-redis:
    image: redis:7.4.2-alpine
    user: "999:1000"
    networks: [browser-control]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  browser-egress:
    build:
      context: .
      dockerfile: Dockerfile.browser-egress
    networks: [browser-control, browser-public]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.25

  browser-worker:
    build:
      context: .
      dockerfile: Dockerfile.browser
    environment:
      - BROWSER_REDIS_URL=redis://browser-redis:6379/0
      - BROWSER_ARTIFACT_DIR=/artifacts
      - HTTPS_PROXY=http://browser-egress:8080
    networks: [browser-control]
    volumes: [leadflow_browser_artifacts:/artifacts]
    depends_on:
      browser-redis:
        condition: service_started
      browser-egress:
        condition: service_started
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 1536m
    cpus: 1.0

  reconciler:
    build: .
    environment:
      - APP_ENV=development
      - SECRET_KEY=dev-only-change-me
      - DATABASE_URL=sqlite:////data/leadflow-v2.db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - leadflow_data:/data
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "while true; do python -m app.modules.acquisition.jobs reconcile; sleep 60; done",
      ]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  leadflow_data:
  redis_data:
  leadflow_browser_artifacts:

networks:
  browser-control:
    internal: true
  browser-public: {}
